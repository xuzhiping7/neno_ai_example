<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">助理对话 API 交互流程</title>
<desc id="desc">外部业务系统使用项目 API 秘钥向现有平台助理发送需求。助理在平台内部按需调用项目文件、知识、虚拟机或云主机，并使用原有对话记录。客户端直接接收回答、进度和结果。本轮末尾包含提问时，客户端展示返回的问题并提交答案，在同一会话中继续；没有提问时，本轮结束。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="#466aa6"/></marker>
  <marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5L1 8Z" fill="#8ba0b9"/></marker>
  <style>text { font-family: 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; } .flow { fill:none;stroke:#466aa6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow); } .record { fill:none;stroke:#8ba0b9;stroke-width:2;stroke-dasharray:5 5;stroke-linejoin:round;marker-end:url(#muted-arrow); }</style>
</defs>
<rect width="1120" height="760" rx="18" fill="#ffffff"/>

<text x="40" y="50" font-size="30" fill="#183653" font-weight="700" text-anchor="start">助理对话 API 交互流程</text>
<text x="40" y="83" font-size="19" fill="#5c718b" font-weight="400" text-anchor="start">使用现有助理完成业务需求，回复与记录保持在同一会话中。</text>
<rect x="345" y="118" width="430" height="490" rx="18" fill="#f4f7fc" stroke="#c7d7eb" stroke-width="1.5"/>
<text x="560" y="153" font-size="21" fill="#426695" font-weight="650" text-anchor="middle">平台内部</text>
<text x="160" y="153" font-size="20" fill="#637b96" font-weight="600" text-anchor="middle">调用方</text>
<text x="960" y="153" font-size="20" fill="#637b96" font-weight="600" text-anchor="middle">调用方</text>
<rect x="38" y="180" width="244" height="110" rx="14" fill="#ffffff" stroke="#bbcee6" stroke-width="1.5"/>
<text x="160" y="223" font-size="27" fill="#183653" font-weight="650" text-anchor="middle">外部业务系统</text>
<text x="160" y="263" font-size="19" fill="#5c718b" font-weight="400" text-anchor="middle">提交需求 / 回复提问</text>
<rect x="395" y="180" width="330" height="110" rx="14" fill="#e9f0ff" stroke="#aac2e9" stroke-width="1.5"/>
<text x="560" y="223" font-size="27" fill="#234b89" font-weight="700" text-anchor="middle">现有平台助理</text>
<text x="560" y="263" font-size="19" fill="#526f97" font-weight="400" text-anchor="middle">沿用项目配置、技能和权限</text>
<rect x="838" y="180" width="244" height="110" rx="14" fill="#edf8f2" stroke="#b6d7c6" stroke-width="1.5"/>
<text x="960" y="223" font-size="26" fill="#2d654a" font-weight="650" text-anchor="middle">接收对话输出</text>
<text x="960" y="263" font-size="19" fill="#4e7660" font-weight="400" text-anchor="middle">回答 · 进度 · 结果</text>
<path d="M282 235H388" class="flow"/>
<text x="336" y="215" font-size="18" fill="#466aa6" font-weight="600" text-anchor="middle">① 请求</text>
<path d="M725 235H831" class="flow"/>
<text x="782" y="215" font-size="18" fill="#466aa6" font-weight="600" text-anchor="middle">② 输出</text>
<path d="M560 290V354" class="flow"/>
<text x="613" y="330" font-size="18" fill="#5c718b" font-weight="400" text-anchor="middle">按需调用</text>
<rect x="395" y="361" width="330" height="90" rx="14" fill="#ffffff" stroke="#d3dfed" stroke-width="1.5"/>
<text x="560" y="398" font-size="23" fill="#183653" font-weight="600" text-anchor="middle">项目资源</text>
<text x="560" y="432" font-size="18" fill="#5c718b" font-weight="400" text-anchor="middle">文件与知识 · 虚拟机 · 云主机</text>
<rect x="395" y="488" width="330" height="84" rx="14" fill="#ffffff" stroke="#d3dfed" stroke-width="1.5"/>
<text x="560" y="522" font-size="23" fill="#183653" font-weight="600" text-anchor="middle">对话记录</text>
<text x="560" y="553" font-size="18" fill="#5c718b" font-weight="400" text-anchor="middle">平台与 API 共用，可同步查看</text>
<path d="M395 266H369V530H388" class="record"/>
<rect x="350" y="461" width="38" height="27" fill="#f4f7fc"/>
<text x="369" y="481" font-size="17" fill="#7188a3" font-weight="400" text-anchor="middle">记录</text>
<path d="M960 290V374" class="flow"/>
<text x="1018" y="339" font-size="18" fill="#5c718b" font-weight="400" text-anchor="middle">本轮结束时</text>
<path d="M960 381L1065 439L960 497L855 439Z" fill="#f5f8fc" stroke="#bbcee6" stroke-width="1.5"/>
<text x="960" y="433" font-size="23" fill="#34567d" font-weight="500" text-anchor="middle">末尾包含</text>
<text x="960" y="464" font-size="23" fill="#34567d" font-weight="500" text-anchor="middle">提问？</text>
<path d="M960 497V544" class="flow"/>
<text x="987" y="528" font-size="19" fill="#637b96" font-weight="400" text-anchor="middle">无</text>
<rect x="838" y="551" width="244" height="65" rx="14" fill="#edf8f2" stroke="#b6d7c6" stroke-width="1.5"/>
<text x="960" y="593" font-size="24" fill="#2d654a" font-weight="600" text-anchor="middle">本轮结束</text>
<path d="M1065 439H1094V674H160V297" class="flow"/>
<text x="1083" y="423" font-size="19" fill="#466aa6" font-weight="400" text-anchor="middle">有</text>
<rect x="307" y="638" width="642" height="30" rx="6" fill="#ffffff"/>
<text x="628" y="661" font-size="22" fill="#365d94" font-weight="600" text-anchor="middle">③ 展示返回的问题并提交答案，继续同一会话</text>
<path d="M40 709H1080" stroke="#e1e7ef" stroke-width="1"/>
<text x="560" y="741" font-size="19" fill="#5c718b" font-weight="400" text-anchor="middle">提问直接随对话末尾返回；项目资源由助理按现有权限使用。</text>
</svg>